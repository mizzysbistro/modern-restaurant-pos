name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Do not cancel a valid build just because a newer commit was pushed.
  # Each commit gets its own run; APK versionCode still follows the run number.
  group: mizzy-pos-apk-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore explicit debug signing key
        id: restore-signing
        uses: actions/cache/restore@v4
        with:
          path: .signing/debug.keystore
          key: mizzy-pos-persistent-debug-signing-v1
      - name: Create signing key only during initial setup
        shell: bash
        run: |
          mkdir -p .signing
          if [[ -s .signing/debug.keystore ]]; then
            echo "Using the cached persistent signing key."
          elif [[ -f .signing/KEY_INITIALIZED ]]; then
            echo "::error::The persistent signing key is missing. Refusing to generate a replacement because it would break APK updates. Restore the original key securely."
            exit 1
          else
            keytool -genkeypair -v -keystore .signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mizzy's Bistro POS, OU=Development, O=Mizzy's Bistro, C=PH" -noprompt
          fi
      - name: Save signing key before test/build steps
        if: steps.restore-signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .signing/debug.keystore
          key: mizzy-pos-persistent-debug-signing-v1
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Verify POS frontend and data-safety rules
        run: node scripts/verify-pos.mjs
      - name: Run POS JavaScript regression tests
        run: node --test tests/*.test.cjs
      - name: Set increasing APK version
        run: |
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.0.$GITHUB_RUN_NUMBER'/" app/build.gradle
      - name: Run SQLite JVM tests and compile device tests
        run: gradle --no-daemon testDebugUnitTest assembleDebugAndroidTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature matches persistent key
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          KEY_SHA="$(keytool -list -v -keystore .signing/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$KEY_SHA" || -z "$APK_SHA" || "$KEY_SHA" != "$APK_SHA" ]]; then
            echo "::error::APK signer does not match the persistent signing key."
            echo "Keystore fingerprint: $KEY_SHA"
            echo "APK fingerprint: $APK_SHA"
            exit 1
          fi
          printf '%s\\n' "$APK_SHA" > app/build/outputs/apk/debug/signing-certificate.sha256
          echo "Verified APK signing certificate SHA-256: $APK_SHA"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: modern-restaurant-pos-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-certificate.sha256
          if-no-files-found: error
          retention-days: 14
