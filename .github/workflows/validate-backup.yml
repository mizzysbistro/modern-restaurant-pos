name: Validate POS Backup and Restore

on:
  push:
    branches: [feature/backup-restore]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep one commit's test run from cancelling another commit's validation.
  group: validate-pos-backup-restore-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK paths
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Create temporary validation signing key
        run: |
          mkdir -p .signing
          keytool -genkeypair -v -keystore .signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Temporary Validation Only, C=PH" -noprompt
      - name: Check POS frontend and backup safety
        run: node scripts/verify-pos.mjs
      - name: Run backup validation tests
        run: node --test tests/backup-schema.test.cjs
      - name: Run SQLite unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Compile app and instrumentation tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
